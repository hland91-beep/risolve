# Netlify 설정 — 정적 HTML + 서버리스 함수(자동조회 프록시)
# 연결만 하면 동작하도록 함수 디렉터리·번들러 지정. 빌드 스텝 없음(정적).
[build]
  publish = "."
  functions = "netlify/functions"

# Pretty URLs(.html 제거 리다이렉트)가 쿼리스트링을 유실시켜 탭 연동을 깨뜨림 → 비활성
[build.processing]
  skip_processing = true

# 브라우저가 옛 HTML 을 재사용해 수정이 반영 안 되는 문제 방지(항상 재검증)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[functions]
  node_bundler = "esbuild"                 # require("./corp-map.json") 인라인 번들
  included_files = ["netlify/functions/corp-map.json"]

# 함수 기본 경로는 /.netlify/functions/<name> (HTML 의 FUND_URL/FLOW_URL 이 이 경로를 사용)
